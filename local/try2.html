<html lang="en">
    <head>
        <title>Pengine Example</title>
    </head>
    <body>
        <h1>Pengine try2 Example</h1>

        <div id="out"></div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.0.3/jquery.min.js"></script>
        <script src="https://pengines.swi-prolog.org/pengine/pengines.js"></script>

        <script type="text/x-prolog">

            main :-
                repeat,
                pengine_input('Give me an X', X),
                pengine_output(X),
                X == stop.

        </script>
        <script>
            var pengine = new Pengine({
                server: "http://localhost:3030/pengine",
                oncreate: handleCreate,
                onprompt: handlePrompt,
                onoutput: handleOutput
            });
            function handleCreate() {
                // console.log("handleCreate");
                pengine.ask('main');
            }
            function handlePrompt() {
                // console.log("handlePrompt: ", this.data);
                pengine.respond(prompt(this.data));
            }
            function handleOutput() {
                // console.log("handleOutput: ", this.data);
                $('#out').html(this.data);
            }
        </script>
    </body>
</html>
